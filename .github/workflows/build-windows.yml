name: Build Windows EXE\n\non:\n  workflow_dispatch:\n  push:\n    branches:\n      - main\n    tags:\n      - "v*"\n\npermissions:\n  contents: write\n\nenv:\n  PYTHON_VERSION: "3.12"\n\njobs:\n  build:\n    runs-on: windows-latest\n\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Set up Python\n        uses: actions/setup-python@v5\n        with:\n          python-version: ${{ env.PYTHON_VERSION }}\n          cache: pip\n\n      - name: Install dependencies\n        shell: pwsh\n        run: |\n          python -m pip install --upgrade pip\n          python -m pip install -r requirements.txt\n\n      - name: Compile Python sources\n        shell: pwsh\n        run: python -m compileall -q .\n\n      - name: Run regression tests\n        shell: pwsh\n        env:\n          QT_QPA_PLATFORM: offscreen\n        run: python -m pytest -q\n\n      - name: Build single-file executable\n        shell: pwsh\n        run: |\n          pyinstaller --noconfirm --clean --onefile --windowed --name ChromiumThemeStudio main.py\n          if (!(Test-Path dist/ChromiumThemeStudio.exe)) { throw "EXE build failed" }\n          Compress-Archive -Path dist/ChromiumThemeStudio.exe -DestinationPath ChromiumThemeStudio-Windows.zip -Force\n\n      - name: Upload workflow artifact\n        uses: actions/upload-artifact@v4\n        with:\n          name: ChromiumThemeStudio-Windows\n          path: ChromiumThemeStudio-Windows.zip\n          if-no-files-found: error\n\n      - name: Attach ZIP to GitHub release\n        if: startsWith(github.ref, 'refs/tags/v')\n        uses: softprops/action-gh-release@v2\n        with:\n          files: ChromiumThemeStudio-Windows.zip\n          generate_release_notes: true\n